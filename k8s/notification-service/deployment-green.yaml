apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-green
  labels:
    app: notification-service
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
      version: green
  template:
    metadata:
      labels:
        app: notification-service
        version: green
    spec:
      containers:
        - name: notification-service
          image: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-notification-service:latest
          ports:
            - containerPort: 5003
