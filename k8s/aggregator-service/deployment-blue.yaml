apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator-service-blue
  labels:
    app: aggregator-service
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator-service
      version: blue
  template:
    metadata:
      labels:
        app: aggregator-service
        version: blue
    spec:
      containers:
      - name: aggregator
        image: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-aggregator-service:blue
        env:
        - name: DB_HOST
          value: "mooninsurance.ca7isqgecjpt.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "mooninsurance_db"
        - name: DB_USER
          value: "admin"
        - name: DB_PASS
          value: "Hsnmef_9575$"
        ports:
        - containerPort: 5004