apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  labels:
    app: agent-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-agent-service:latest
          ports:
            - containerPort: 5000
