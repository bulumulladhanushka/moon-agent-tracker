apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service-green
  labels:
    app: agent-service
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
      version: green
  template:
    metadata:
      labels:
        app: agent-service
        version: green
    spec:
      containers:
        - name: agent-service
          image: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-agent-service:green # use specific green image tag
          ports:
            - containerPort: 5000
