name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - test
      - prod

env:
  AWS_REGION: us-east-1
  ECR_REPO_AGENT: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-agent-service
  ECR_REPO_INTEGRATION: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-integration-service
  ECR_REPO_NOTIFICATION: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-notification-service
  ECR_REPO_AGGREGATOR: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-aggregator-service

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Agent Service
        uses: docker/build-push-action@v5
        with:
          context: ./agent_service
          push: true
          tags: ${{ env.ECR_REPO_AGENT }}:latest

      - name: Build & Push Integration Service
        uses: docker/build-push-action@v5
        with:
          context: ./integration_service
          push: true
          tags: ${{ env.ECR_REPO_INTEGRATION }}:latest

      - name: Build & Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./notification_service
          push: true
          tags: ${{ env.ECR_REPO_NOTIFICATION }}:latest

      - name: Build & Push Aggregator Service
        uses: docker/build-push-action@v5
        with:
          context: ./aggregator-service
          push: true
          tags: ${{ env.ECR_REPO_AGGREGATOR }}:latest

  deploy-test:
    if: github.ref == 'refs/heads/test'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name mooninsurance-ekscluster

      - name: Deploy to Test Environment
        run: |
          kubectl apply -f k8s/agent-service
          kubectl apply -f k8s/integration-service
          kubectl apply -f k8s/notification-service
          kubectl apply -f k8s/aggregator-service

  deploy-prod:
    if: github.ref == 'refs/heads/prod'
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name mooninsurance-ekscluster

      - name: Deploy to Production Environment
        run: |
          kubectl apply -f k8s/agent-service
          kubectl apply -f k8s/integration-service
          kubectl apply -f k8s/notification-service
          kubectl apply -f k8s/aggregator-service
