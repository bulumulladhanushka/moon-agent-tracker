name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Agent Service (blue/green)
        uses: docker/build-push-action@v5
        with:
          context: ./agent-service
          push: true
          tags: |
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-agent-service:blue
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-agent-service:green

      - name: Build & push Integration Service (blue/green)
        uses: docker/build-push-action@v5
        with:
          context: ./integration-service
          push: true
          tags: |
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-integration-service:blue
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-integration-service:green

      - name: Build & push Notification Service (blue/green)
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: |
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-notification-service:blue
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-notification-service:green

      - name: Build & push Aggregator Service (blue/green)
        uses: docker/build-push-action@v5
        with:
          context: ./aggregator-service
          push: true
          tags: |
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-aggregator-service:blue
            457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-aggregator-service:green

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name mooninsurance-ekscluster

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/agent-service
          kubectl apply -f k8s/integration-service
          kubectl apply -f k8s/notification-service
          kubectl apply -f k8s/aggregator-service
