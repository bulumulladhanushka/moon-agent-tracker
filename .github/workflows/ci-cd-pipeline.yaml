name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 457087769533.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER_NAME: mooninsurance-ekscluster

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          # if you’re assuming a role, set role-to-assume
          # role-to-assume: arn:aws:iam::457087769533:role/YourGithubActionsRole
          # role-session-name: GitHubActions

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push Agent Service images
        uses: docker/build-push-action@v5
        with:
          context: ./agent-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/moon-agent-service:blue
            ${{ env.ECR_REGISTRY }}/moon-agent-service:green

      - name: Build & push Integration Service images
        uses: docker/build-push-action@v5
        with:
          context: ./integration-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/moon-integration-service:blue
            ${{ env.ECR_REGISTRY }}/moon-integration-service:green

      - name: Build & push Notification Service images
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/moon-notification-service:blue
            ${{ env.ECR_REGISTRY }}/moon-notification-service:green

      - name: Build & push Aggregator Service images
        uses: docker/build-push-action@v5
        with:
          context: ./aggregator-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/moon-aggregator-service:blue
            ${{ env.ECR_REGISTRY }}/moon-aggregator-service:green

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          # role-to-assume: arn:aws:iam::457087769533:role/YourGithubActionsRole
          # role-session-name: GitHubActionsDeploy

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Deploy to EKS (Blue‑Green)
        run: |
          kubectl apply --server-side --force-conflicts -f k8s/agent-service
          kubectl apply --server-side --force-conflicts -f k8s/integration-service
          kubectl apply --server-side --force-conflicts -f k8s/notification-service
          kubectl apply --server-side --force-conflicts -f k8s/aggregator-service
