name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Build and push Agent Service image
        uses: docker/build-push-action@v5
        with:
          context: ./agent_service
          push: true
          tags: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-agent-service:latest

      - name: Build and push Integration Service image
        uses: docker/build-push-action@v5
        with:
          context: ./integration_service
          push: true
          tags: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-integration-service:latest

      - name: Build and push Notification Service image
        uses: docker/build-push-action@v5
        with:
          context: ./notification_service
          push: true
          tags: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-notification-service:latest

  # Future job: Deploy to EKS using Blue-Green strategy
  # deploy:
