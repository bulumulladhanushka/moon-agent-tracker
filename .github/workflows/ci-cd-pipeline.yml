name: Build and Deploy to ECR

on:
  push:
    branches:
      - dev  # You can change this to any branch that you want to trigger the pipeline from

jobs:
  build:
    runs-on: ubuntu-latest  # This specifies the environment where your pipeline will run

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2  # Checks out the repository so the workflow can access it

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2  # Set up Docker Buildx, which enables multi-platform builds

    - name: Cache Docker layers
      uses: actions/cache@v2  # Caches Docker layers to speed up the build process
      with:
        path: ~/.cache/docker
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1  # Logs into ECR using your AWS credentials

    - name: Build and Push Docker image
      run: |
        # Build the Docker image using the Dockerfile in the repository
        docker build -t ${{ secrets.ECR_REPO_URI }}:latest .

        # Push the Docker image to ECR
        docker push ${{ secrets.ECR_REPO_URI }}:latest
