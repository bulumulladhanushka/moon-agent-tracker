name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  DOCKER_REPO: bulumulladhanu

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push Agent Service image
      uses: docker/build-push-action@v5
      with:
        context: ./agent_service
        push: true
        tags: ${{ env.DOCKER_REPO }}/agent_service:latest

    - name: Build and push Integration Service image
      uses: docker/build-push-action@v5
      with:
        context: ./integration_service
        push: true
        tags: ${{ env.DOCKER_REPO }}/integration_service:latest

    - name: Build and push Notification Service image
      uses: docker/build-push-action@v5
      with:
        context: ./notification_service
        push: true
        tags: ${{ env.DOCKER_REPO }}/notification_service:latest

