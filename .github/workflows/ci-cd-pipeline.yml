name: Build and Deploy to ECR

on:
  push:
    branches:
      - dev  

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Log in to Amazon ECR
    - name: Log in to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1
      env:
        AWS_REGION: us-east-1  # Set the AWS region here

    # Build and push Agent Service image to ECR
    - name: Build and push Agent Service image
      uses: docker/build-push-action@v5
      with:
        context: ./agent_service  # Path to the agent service folder
        push: true
        tags: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-agent-service:latest

    # Build and push Integration Service image to ECR
    - name: Build and push Integration Service image
      uses: docker/build-push-action@v5
      with:
        context: ./integration_service  # Path to the integration service folder
        push: true
        tags: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-integration-service:latest

    # Build and push Notification Service image to ECR
    - name: Build and push Notification Service image
      uses: docker/build-push-action@v5
      with:
        context: ./notification_service  # Path to the notification service folder
        push: true
        tags: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-notification-service:latest

  # Future job: Deploy to EKS using Blue-Green strategy
  # deploy:
