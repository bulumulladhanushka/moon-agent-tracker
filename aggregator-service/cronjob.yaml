apiVersion: batch/v1
kind: CronJob
metadata:
  name: aggregator-service-cronjob
  namespace: default
spec:
  schedule: "*/5 * * * *"  # every 5 minutes, for testing
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: aggregator
            image: 457087769533.dkr.ecr.us-east-1.amazonaws.com/moon-aggregator-service:green
            imagePullPolicy: Always
            env:
            - name: RUN_MODE
              value: "job"
            - name: DB_HOST
              value: "mooninsurance.ca7isqgecjpt.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "mooninsurance_db"
            - name: DB_USER
              value: "admin"
            - name: DB_PASS
              value: "Hsnmef_9575$"
          restartPolicy: OnFailure
